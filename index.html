<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Русский алфавит · 俄語字母</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@1,400&family=Marck+Script&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3E2A47;        /* тёмно-сливовый текст */
  --plum-soft:#7A6484;
  --white:#FFFFFF;
  --bg:#FFFBF7;
  --coral:#FF8A7A;  --coral-d:#E0604F; --coral-l:#FFE3DE;
  --mint:#7FD6B8;   --mint-d:#3FA985;  --mint-l:#DDF5EC;
  --butter:#FFD86B; --butter-d:#D9A826; --butter-l:#FFF4CF;
  --lilac:#B9A2E8;  --lilac-d:#8468C9; --lilac-l:#EEE7FB;
  --line:#EFE4EA;
  --radius:16px;
  --shadow:0 2px 10px rgba(62,42,71,.08);
  --hand:'Marck Script',cursive;
  --ital:'PT Serif',Georgia,serif;
  --print:'PT Sans','Noto Sans TC',sans-serif;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'PT Sans','Noto Sans TC','Noto Sans JP','PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);color:var(--plum);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}
.app{width:100%;max-width:640px;padding:14px 16px 24px;flex:1}
button{font-family:inherit}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--white);font-size:20px;color:var(--plum);cursor:pointer;display:none;flex:0 0 auto;
}
.titlebox{flex:1;min-width:0}
.titlebox h1{font-size:1.15rem;line-height:1.2}
.titlebox .sub{font-size:.8rem;color:var(--plum-soft)}
.stars{color:var(--butter-d);font-weight:700;white-space:nowrap}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}
.lang{
  border:1.5px solid var(--line);background:var(--white);border-radius:999px;
  padding:5px 11px;font-size:.8rem;cursor:pointer;color:var(--plum);
}
.lang.on{background:var(--lilac);border-color:var(--lilac);color:#fff;font-weight:700}

/* ---------- общие ---------- */
.screen{display:none}
.screen.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.instr{
  background:var(--lilac-l);border-left:4px solid var(--lilac);border-radius:10px;
  padding:10px 12px;font-size:.88rem;margin-bottom:14px;line-height:1.5;
}
.tri .ru{font-weight:700}
.tri .en{color:var(--plum-soft)}
.tri .loc{color:var(--plum)}
.btn{
  border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:.98rem;
  cursor:pointer;color:#fff;background:var(--coral);
}
.btn:active{filter:brightness(.92)}
.btn.mint{background:var(--mint-d)}
.btn.lil{background:var(--lilac-d)}
.btn.ghost{background:var(--white);color:var(--plum);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tag{
  display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;
  padding:2px 8px;vertical-align:middle;
}
.tag.l1{background:var(--coral-l);color:var(--coral-d)}
.tag.l2{background:var(--mint-l);color:var(--mint-d)}
.tag.l3{background:var(--butter-l);color:#A67C00}
.tag.l0{background:var(--lilac-l);color:var(--lilac-d)}
.st{color:var(--coral-d)}
.hl{background:var(--butter);border-radius:4px;padding:0 1px}

/* ---------- дом ---------- */
.hero{
  background:var(--butter-l);border:1px solid #F5E6B0;border-radius:20px;
  padding:18px;margin-bottom:16px;position:relative;overflow:hidden;
}
.hero::after{
  content:"Аа";position:absolute;right:-6px;bottom:-40px;font-family:var(--hand);
  font-size:130px;color:rgba(255,138,122,.18);
}
.hero .big{font-size:1.45rem;font-weight:700;line-height:1.3}
.hero .small{font-size:.85rem;color:var(--plum-soft);margin:6px 0 12px;position:relative;z-index:1}
.hero .btn{position:relative;z-index:1}
.menu{display:grid;gap:10px}
.mitem{
  display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
}
.mitem:active{transform:scale(.98)}
.mnum{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;flex:0 0 auto;font-size:1.05rem;
}
.mtext{flex:1;min-width:0;line-height:1.3}
.mtext .ru{font-weight:700}
.mtext .sm{font-size:.8rem;color:var(--plum-soft)}
.mstar{color:var(--butter-d);white-space:nowrap}

/* ---------- азбука (сетка) ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;margin-bottom:10px;color:var(--plum-soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acard{
  background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:9px 4px 7px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  border-top:5px solid var(--mint);
}
.acard:active{transform:scale(.95)}
.acard.k-vh,.acard.k-vs{border-top-color:var(--coral)}
.acard.k-ch,.acard.k-cs{border-top-color:var(--mint-d)}
.acard.k-sg{border-top-color:var(--lilac)}
.acard .p{font-size:1.7rem;font-weight:700;line-height:1.1}
.acard .h{font-family:var(--hand);font-size:1.35rem;color:var(--lilac-d);line-height:1.2}
.acard .n{font-size:.68rem;color:var(--plum-soft)}

/* ---------- карточка буквы ---------- */
.lnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lnav .btn{padding:9px 14px}
.lnav .pos{font-size:.85rem;color:var(--plum-soft)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.form{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  text-align:center;padding:10px 4px 8px;box-shadow:var(--shadow);
}
.form .g{font-size:3rem;line-height:1.15;min-height:3.6rem}
.form.f-print .g{font-family:var(--print);font-weight:700}
.form.f-ital .g{font-family:var(--ital);font-style:italic;color:var(--mint-d)}
.form.f-hand .g{font-family:var(--hand);color:var(--lilac-d)}
.form .cap{font-size:.7rem;color:var(--plum-soft);line-height:1.3}
.panel{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.panel h3{font-size:.8rem;color:var(--plum-soft);font-weight:700;margin-bottom:6px;letter-spacing:.02em}
.sndrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{
  display:flex;align-items:center;gap:8px;border:none;border-radius:999px;
  padding:9px 15px;cursor:pointer;font-size:1rem;color:var(--plum);
}
.pill.name{background:var(--coral-l)}
.pill.snd{background:var(--mint-l)}
.pill b{font-size:1.1rem}
.trn{font-family:var(--print);font-size:1.05rem;color:var(--mint-d);font-weight:700}
.kind{font-size:.8rem;margin-bottom:6px}
.note{font-size:.9rem;line-height:1.5}
.hwnote{
  background:var(--lilac-l);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem;line-height:1.45;
}
.hwnote::before{content:"✍ ";}
.words{display:grid;gap:8px}
.wrow{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;cursor:pointer;background:#FFFDFB;
}
.wrow:active{background:var(--butter-l)}
.wrow .wp{font-size:1.3rem;font-weight:700;min-width:0}
.wrow .wh{font-family:var(--hand);font-size:1.45rem;color:var(--lilac-d);white-space:nowrap}
.wrow .wg{flex:1;font-size:.78rem;color:var(--plum-soft);line-height:1.3;text-align:right}
.wrow .snd{color:var(--mint-d)}
.trace{position:relative;height:190px;border:2px dashed var(--line);border-radius:var(--radius);background:
  repeating-linear-gradient(to bottom,transparent 0 46px,#F3E6EC 46px 48px);overflow:hidden}
.trace .ghost{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:130px;color:rgba(185,162,232,.28);pointer-events:none;user-select:none;
}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---------- квизы ---------- */
.progress{height:8px;background:#F2E8EE;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;width:0;background:var(--mint-d);transition:width .25s}
.qshow{
  background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  text-align:center;padding:14px 10px;margin-bottom:12px;min-height:110px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.qshow .gh{font-family:var(--hand);font-size:5rem;line-height:1.1;color:var(--lilac-d)}
.qshow .gi{font-family:var(--ital);font-style:italic;font-size:5rem;line-height:1.1;color:var(--mint-d)}
.qshow .gw{font-size:2.2rem;font-weight:700;letter-spacing:.04em}
.qshow .gw .gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--coral);color:var(--coral-d)}
.qshow .gs{font-size:2rem;font-weight:700;letter-spacing:.2em}
.qshow .gloss{font-size:.8rem;color:var(--plum-soft)}
.bigplay{
  display:inline-flex;align-items:center;gap:8px;border:none;background:var(--plum);color:#fff;
  font-weight:700;font-size:1rem;padding:12px 22px;border-radius:16px;cursor:pointer;
}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  background:var(--white);border:2px solid var(--line);border-radius:var(--radius);
  font-size:2rem;font-weight:700;padding:16px 6px;text-align:center;cursor:pointer;color:var(--plum);
}
.opt:active{transform:scale(.96)}
.opt.ok{border-color:var(--mint-d);background:var(--mint-l)}
.opt.no{border-color:var(--coral-d);background:var(--coral-l)}
.opt.dim{opacity:.4;pointer-events:none}
.feedback{min-height:30px;text-align:center;font-weight:700;margin:12px 0;font-size:1rem}
.feedback.ok{color:var(--mint-d)}
.feedback.no{color:var(--coral-d)}

.result{text-align:center;background:var(--white);border-radius:20px;padding:26px 18px;box-shadow:var(--shadow)}
.result h2{font-size:1.4rem}
.result .rstars{font-size:2.3rem;letter-spacing:6px;margin:10px 0;color:var(--butter-d)}
.result .score{font-size:2rem;font-weight:700;color:var(--mint-d)}
.result p{color:var(--plum-soft);font-size:.9rem;margin:8px 0 18px;line-height:1.5}

/* ---------- копирайт ---------- */
.copy{
  width:100%;text-align:center;font-size:.82rem;color:var(--plum-soft);
  padding:14px 10px 18px;border-top:1px solid var(--line);background:var(--bg);
}

@media (max-width:380px){
  .agrid{grid-template-columns:repeat(4,1fr);gap:6px}
  .form .g{font-size:2.5rem}
  .opt{font-size:1.6rem;padding:13px 4px}
  .wrow .wg{display:none}
}
</style>
</head>
<body>
<div class="app">

  <div class="langs" id="langs"></div>

  <div class="top">
    <button class="back" id="backBtn" onclick="goHome()">←</button>
    <div class="titlebox">
      <h1 id="topTitle">Русский алфавит</h1>
      <div class="sub" id="topSub"></div>
    </div>
    <div class="stars" id="topStars"></div>
  </div>

  <!-- ДОМ -->
  <section class="screen active" id="scr-home">
    <div class="hero">
      <div class="big">А Б В Г Д …<br>33 буквы · 33 letters</div>
      <div class="small" id="heroSmall"></div>
      <button class="btn" id="playAllBtn" onclick="playAll()">🔊</button>
    </div>
    <div class="menu" id="menu"></div>
  </section>

  <!-- АЗБУКА -->
  <section class="screen" id="scr-abc">
    <div class="instr tri" id="abcInstr"></div>
    <div class="legend" id="legend"></div>
    <div class="agrid" id="agrid"></div>
  </section>

  <!-- ОДНА БУКВА -->
  <section class="screen" id="scr-letter">
    <div class="lnav">
      <button class="btn ghost" onclick="stepLetter(-1)">←</button>
      <span class="pos" id="lpos"></span>
      <button class="btn ghost" onclick="stepLetter(1)">→</button>
    </div>
    <div class="forms" id="lforms"></div>
    <div class="panel" id="lsound"></div>
    <div class="panel"><h3 id="hWords"></h3><div class="words" id="lwords"></div></div>
    <div class="panel">
      <h3 id="hTrace"></h3>
      <div class="trace" id="trace"><div class="ghost" id="traceGhost"></div><canvas id="traceCv"></canvas></div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" onclick="clearTrace()" id="clearBtn"></button>
        <button class="btn ghost" onclick="toggleCase()" id="caseBtn">А / а</button>
      </div>
    </div>
  </section>

  <!-- КВИЗ -->
  <section class="screen" id="scr-quiz">
    <div class="progress"><i id="qbar"></i></div>
    <div class="instr tri" id="qinstr"></div>
    <div class="qshow" id="qshow"></div>
    <div class="opts" id="qopts"></div>
    <div class="feedback" id="qfb"></div>
  </section>

  <!-- РЕЗУЛЬТАТ -->
  <section class="screen" id="scr-result">
    <div class="result">
      <h2 id="rtitle"></h2>
      <div class="rstars" id="rstars"></div>
      <div class="score" id="rscore"></div>
      <p id="rmsg"></p>
      <div class="row">
        <button class="btn ghost" onclick="retryModule()" id="retryBtn"></button>
        <button class="btn mint" onclick="goHome()" id="menuBtn"></button>
      </div>
    </div>
  </section>

</div>

<footer class="copy">© 2026–2046 耿華</footer>

<script>
/* ============================================================
   РУССКИЙ АЛФАВИТ · 33 буквы
   название · звук · курсив · рукописная форма · слова уроков 1–3
   ============================================================ */

/* ---------- язык комментариев ---------- */
const LANGS = [['zh','中文'],['ja','日本語'],['vi','Tiếng Việt']];
let LANG = 'zh';
try{
  const s = localStorage.getItem('abc_lang');
  if(s && LANGS.some(l=>l[0]===s)) LANG = s;
  else {
    const n = (navigator.language||'').toLowerCase();
    if(n.startsWith('ja')) LANG='ja'; else if(n.startsWith('vi')) LANG='vi';
  }
}catch(e){}

/* ---------- слова уроков 1–3 (ударение — U+0301) ----------
   l: номер урока; 0 = ★ слово «на будущее» (буквы Ц, Щ, Ъ ещё не встречались) */
const FN = {en:'female name',zh:'女生名字',ja:'女性の名前',vi:'tên nữ'};
const MN = {en:'male name',zh:'男生名字',ja:'男性の名前',vi:'tên nam'};
const W = {
 /* урок 1 */
 'как':      {l:1,en:'how',zh:'怎麼',ja:'どう',vi:'thế nào'},
 'тебя́':    {l:1,en:'you (object)',zh:'你（受格）',ja:'君を',vi:'bạn (tân ngữ)'},
 'зову́т':   {l:1,en:'(they) call',zh:'叫（名字）',ja:'（名前を）呼ぶ',vi:'gọi (tên)'},
 'меня́':    {l:1,en:'me',zh:'我（受格）',ja:'私を',vi:'tôi (tân ngữ)'},
 'А́нна':    {l:1,...FN}, 'Е́ва':{l:1,...FN}, 'Зо́я':{l:1,...FN}, 'Ка́тя':{l:1,...FN},
 'Я́на':     {l:1,...FN}, 'Ири́на':{l:1,...FN}, 'О́льга':{l:1,...FN}, 'Ната́лья':{l:1,...FN},
 'Ю́ля':     {l:1,...FN}, 'Ма́ша':{l:1,...FN},
 'Анто́н':   {l:1,...MN}, 'Во́ва':{l:1,...MN}, 'Ива́н':{l:1,...MN}, 'Ю́рий':{l:1,...MN},
 'Пётр':     {l:1,...MN}, 'Лёша':{l:1,...MN}, 'Серге́й':{l:1,...MN}, 'Серёжа':{l:1,...MN},
 'Же́ня':    {l:1,...MN}, 'Са́ша':{l:1,...MN},
 'А́нечка':  {l:1,en:'Anna (affectionate)',zh:'安娜（暱稱）',ja:'アンナ（愛称）',vi:'Anna (tên thân mật)'},
 /* урок 2 */
 'приве́т':  {l:2,en:'hi',zh:'嗨',ja:'やあ',vi:'chào'},
 'до́брый':  {l:2,en:'good (Добрый день!)',zh:'美好的（日安！）',ja:'良い（こんにちは！）',vi:'tốt lành (Chào buổi chiều!)'},
 'день':     {l:2,en:'day',zh:'天、日',ja:'日',vi:'ngày'},
 'дела́':    {l:2,en:'things (Как дела?)',zh:'事情（你好嗎？）',ja:'調子（元気？）',vi:'công việc (Bạn khỏe không?)'},
 'хорошо́':  {l:2,en:'well, fine',zh:'很好',ja:'いい、元気',vi:'tốt'},
 'пло́хо':   {l:2,en:'badly',zh:'不好',ja:'悪い',vi:'tệ'},
 'норма́льно':{l:2,en:'OK',zh:'還好',ja:'まあまあ',vi:'bình thường'},
 'обы́чно':  {l:2,en:'usually',zh:'平常',ja:'いつも通り',vi:'như thường lệ'},
 'пого́да':  {l:2,en:'weather',zh:'天氣',ja:'天気',vi:'thời tiết'},
 'уро́к':    {l:2,en:'lesson',zh:'課',ja:'課、レッスン',vi:'bài học'},
 'два':      {l:2,en:'two',zh:'二',ja:'二',vi:'hai'},
 'три':      {l:2,en:'three',zh:'三',ja:'三',vi:'ba'},
 /* урок 3 */
 'я':        {l:3,en:'I',zh:'我',ja:'私',vi:'tôi'},
 'ты':       {l:3,en:'you',zh:'你',ja:'君',vi:'bạn'},
 'он':       {l:3,en:'he',zh:'他',ja:'彼',vi:'anh ấy'},
 'она́':     {l:3,en:'she',zh:'她',ja:'彼女',vi:'cô ấy'},
 'мы':       {l:3,en:'we',zh:'我們',ja:'私たち',vi:'chúng tôi'},
 'вы':       {l:3,en:'you (pl. / polite)',zh:'你們／您',ja:'あなた（方）',vi:'các bạn / ngài'},
 'отку́да':  {l:3,en:'where from',zh:'從哪裡',ja:'どこから',vi:'từ đâu'},
 'куда́':    {l:3,en:'where to',zh:'去哪裡',ja:'どこへ',vi:'đi đâu'},
 'из':       {l:3,en:'from',zh:'從…（來）',ja:'〜から',vi:'từ'},
 'Росси́я':  {l:3,en:'Russia',zh:'俄羅斯',ja:'ロシア',vi:'Nga'},
 'Тайва́нь': {l:3,en:'Taiwan',zh:'台灣',ja:'台湾',vi:'Đài Loan'},
 'Кита́й':   {l:3,en:'China',zh:'中國',ja:'中国',vi:'Trung Quốc'},
 'Япо́ния':  {l:3,en:'Japan',zh:'日本',ja:'日本',vi:'Nhật Bản'},
 'Вьетна́м': {l:3,en:'Vietnam',zh:'越南',ja:'ベトナム',vi:'Việt Nam'},
 'Аме́рика': {l:3,en:'America',zh:'美國',ja:'アメリカ',vi:'Mỹ'},
 'Коре́я':   {l:3,en:'Korea',zh:'韓國',ja:'韓国',vi:'Hàn Quốc'},
 'Москва́':  {l:3,en:'Moscow',zh:'莫斯科',ja:'モスクワ',vi:'Mát-xcơ-va'},
 'Тайбэ́й':  {l:3,en:'Taipei',zh:'台北',ja:'台北',vi:'Đài Bắc'},
 'Хано́й':   {l:3,en:'Hanoi',zh:'河內',ja:'ハノイ',vi:'Hà Nội'},
 'Гаосю́н':  {l:3,en:'Kaohsiung',zh:'高雄',ja:'高雄',vi:'Cao Hùng'},

/* ---------- утилиты ---------- */
const $ = id => document.getElementById(id);
const plain = s => s.replace(/\u0301/g,'');
const tx = o => o[LANG];
function tri(o){ return `<div class="ru">${o.ru}</div><div class="en">${o.en}</div><div class="loc">${o[LANG]}</div>`; }
function shuffle(a){ return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]); }
function pick(a,n){ return shuffle(a).slice(0,n); }
/* слово с ударением (красная гласная) и подсветкой нужной буквы */
function acc(w, hl){
  const ch = Array.from(w); let out='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i]; if(c==='\u0301') continue;
    const stress = ch[i+1]==='\u0301';
    const isHl = hl && c.toUpperCase()===hl;
    const cls = [stress?'st':'', isHl?'hl':''].join(' ').trim();
    const t = c + (stress?'\u0301':'');
    out += cls ? `<span class="${cls}">${t}</span>` : t;
  }
  return out;
}
function lessonTag(l){
  return l ? `<span class="tag l${l}">${l===1?'Урок 1':l===2?'Урок 2':'Урок 3'}</span>`
           : `<span class="tag l0">${UI.preview.ru} · ${tx(UI.preview)}</span>`;
}

let recAudio=null;
function playRec(key){
  if(recAudio){ recAudio.pause(); }
  recAudio=new Audio(REC[key]); recAudio.play().catch(()=>{});
}
/* ---------- озвучка ---------- */
let ruVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  ruVoice = vs.find(v=>v.lang==='ru-RU') || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ru')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function mkUtt(text, rate){
  const u=new SpeechSynthesisUtterance(plain(text));
  u.lang='ru-RU'; if(ruVoice) u.voice=ruVoice; u.rate=rate||0.85; u.pitch=1;
  return u;
}
function speak(text, rate){
  if(REC[text]){ stopSeq(); if('speechSynthesis' in window) speechSynthesis.cancel(); playRec(text); return; }
  if(recAudio){ recAudio.pause(); }
  if(!('speechSynthesis' in window)){ alert('Озвучка не поддерживается · 此瀏覽器不支援語音'); return; }
  stopSeq(); speechSynthesis.cancel(); speechSynthesis.speak(mkUtt(text,rate));
}
const VOW = new Set(['А','Е','Ё','И','О','У','Ы','Э','Ю','Я']);
function sayName(o){ speak(o.say, VOW.has(o.L)?0.55:0.72); }
function saySound(o){ speak(o.snd, VOW.has(o.L)?0.55:0.6); }

/* весь алфавит подряд */
let seqOn=false, seqTimer=null;
function stopSeq(){ seqOn=false; clearTimeout(seqTimer); updPlayAll(); }
function playAll(){
  if(!('speechSynthesis' in window)) return;
  if(seqOn){ stopSeq(); speechSynthesis.cancel(); return; }
  speechSynthesis.cancel(); seqOn=true; updPlayAll();
  let i=0;
  const next=()=>{
    if(!seqOn || i>=L.length){ stopSeq(); return; }
    const o=L[i++]; const u=mkUtt(o.say, VOW.has(o.L)?0.6:0.75);
    u.onend=()=>{ seqTimer=setTimeout(next,180); };
    u.onerror=()=>{ seqTimer=setTimeout(next,180); };
    speechSynthesis.speak(u);
  };
  next();
}
function updPlayAll(){ const b=$('playAllBtn'); if(b) b.textContent = seqOn ? '⏹ '+UI.stop.ru+' · '+tx(UI.stop) : '🔊 '+UI.playAll.ru+' · '+tx(UI.playAll); }

/* ---------- навигация ---------- */
const stars = {}; let currentModule=null;
function show(id, title){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  $('backBtn').style.display = id==='scr-home' ? 'none' : 'block';
  $('topTitle').textContent = title || 'Русский алфавит';
  window.scrollTo(0,0);
}
function goHome(){
  if('speechSynthesis' in window){ speechSynthesis.cancel(); } stopSeq();
  clearTimeout(qTimer);
  show('scr-home'); renderHome();
}
function openModule(id){
  currentModule=id;
  if(id==='abc'){ renderAbc(); show('scr-abc','Азбука · '+tx(MODULES[0])); return; }
  startQuiz(id);
}
function retryModule(){ currentModule && openModule(currentModule); }

/* ---------- язык ---------- */
function renderLangs(){
  $('langs').innerHTML = LANGS.map(([k,t])=>`<button class="lang ${k===LANG?'on':''}" onclick="setLang('${k}')">${t}</button>`).join('');
}
function setLang(k){
  LANG=k; try{localStorage.setItem('abc_lang',k);}catch(e){}
  renderLangs(); renderStatic();
  const act=document.querySelector('.screen.active').id;
  if(act==='scr-home') renderHome();
  if(act==='scr-abc') renderAbc();
  if(act==='scr-letter') renderLetter();
  if(act==='scr-quiz' && quiz) $('qinstr').innerHTML = `<b>${quiz.i+1} / ${quiz.rounds.length}</b>` + tri(quiz.rounds[quiz.i].instr);
}
function renderStatic(){
  $('topSub').textContent = UI.sub.ru+' · '+tx(UI.sub);
  $('heroSmall').textContent = UI.hero.ru+' '+tx(UI.hero);
  updPlayAll();
  $('retryBtn').textContent = '↺ '+UI.again.ru+' · '+tx(UI.again);
  $('menuBtn').textContent = UI.menu.ru+' · '+tx(UI.menu);
  $('clearBtn').textContent = '✕ '+UI.clear.ru+' · '+tx(UI.clear);
  $('hWords').textContent = UI.words.ru+' · '+tx(UI.words);
  $('hTrace').textContent = UI.trace.ru+' · '+tx(UI.trace);
}

/* ---------- дом ---------- */
function renderHome(){
  $('menu').innerHTML='';
  MODULES.forEach((m,i)=>{
    const d=document.createElement('div'); d.className='mitem'; d.onclick=()=>openModule(m.id);
    const s=stars[m.id];
    d.innerHTML=`<div class="mnum" style="background:${m.c}">${i+1}</div>
      <div class="mtext"><div class="ru">${m.ru}</div><div class="sm">${m.en} · ${tx(m)}</div></div>
      <div class="mstar">${s!==undefined?'★'.repeat(s)+'☆'.repeat(3-s):''}</div>`;
    $('menu').appendChild(d);
  });
  const total=Object.values(stars).reduce((a,b)=>a+b,0);
  $('topStars').textContent = total ? '★ '+total : '';
}

/* ---------- азбука ---------- */
function renderAbc(){
  $('abcInstr').innerHTML = tri(UI.abcI);
  $('legend').innerHTML = [['vh','vs'],['cp'],['ch','cs'],['sg']].map(ks=>{
    const k=KIND[ks[0]];
    const lbl = ks[0][0]==='v' ? {ru:'гласные',x:{zh:'母音',ja:'母音',vi:'nguyên âm'}}
             : ks[0]==='cp' ? {ru:'согласные',x:{zh:'子音',ja:'子音',vi:'phụ âm'}}
             : ks[0]==='sg' ? {ru:'знаки',x:{zh:'符號',ja:'記号',vi:'dấu'}}
             : {ru:'всегда тв./мягк.',x:{zh:'永遠硬／軟',ja:'常に硬／軟',vi:'luôn cứng/mềm'}};
    return `<span><i style="background:${k.c}"></i>${lbl.ru} · ${lbl.x[LANG]}</span>`;
  }).join('');
  const g=$('agrid'); g.innerHTML='';
  L.forEach((o,i)=>{
    const c=document.createElement('div'); c.className='acard k-'+o.k;
    c.innerHTML=`<div class="p">${o.L}${o.L.toLowerCase()}</div><div class="h">${o.L}${o.L.toLowerCase()}</div><div class="n">${o.nm.replace('\u0301','')}</div>`;
    c.onclick=()=>{ curL=i; renderLetter(); show('scr-letter', o.L+o.L.toLowerCase()+' · '+o.nm.replace('\u0301','')); sayName(o); };
    g.appendChild(c);
  });
}

/* ---------- одна буква ---------- */
let curL=0, traceUpper=true;
function stepLetter(d){
  curL=(curL+d+L.length)%L.length; renderLetter();
  const o=L[curL]; $('topTitle').textContent=o.L+o.L.toLowerCase()+' · '+o.nm.replace('\u0301','');
  sayName(o); window.scrollTo(0,0);
}
function renderLetter(){
  const o=L[curL], k=KIND[o.k], lo=o.L.toLowerCase();
  $('lpos').textContent = (curL+1)+' / 33';
  $('lforms').innerHTML =
    `<div class="form f-print"><div class="g">${o.L}${lo}</div><div class="cap">${UI.print.ru}<br>${tx(UI.print)}</div></div>
     <div class="form f-ital"><div class="g">${o.L}${lo}</div><div class="cap">${UI.ital.ru}<br>${tx(UI.ital)}</div></div>
     <div class="form f-hand"><div class="g">${o.L}${lo}</div><div class="cap">${UI.hand.ru}<br>${tx(UI.hand)}</div></div>`;
  $('lsound').innerHTML =
    `<div class="sndrow">
       <button class="pill name" onclick="sayName(L[curL])">🔊 ${UI.name.ru} · ${tx(UI.name)}: <b>${acc(o.nm)}</b></button>
       <button class="pill snd" onclick="saySound(L[curL])">🔊 ${UI.sound.ru} · ${tx(UI.sound)}: <span class="trn">${o.tr}</span></button>
     </div>
     <div class="kind"><span class="tag" style="background:${k.c};color:#fff">${k.ru}</span>
       <span style="color:var(--plum-soft)"> ${k.en} · ${tx(k)}</span></div>
     <div class="note tri">${tri(o.n)}</div>
     ${o.hw?`<div class="hwnote tri"><b>${o.hw.ru}</b><br><span class="en">${o.hw.en}</span><br>${tx(o.hw)}</div>`:''}`;
  $('lwords').innerHTML = o.w.map(w=>{
    const d=W[w];
    return `<div class="wrow" onclick="speak('${w}',0.8)">
      <div class="wp">${acc(w,o.L)}</div><div class="wh">${plain(w)}</div>
      <div class="wg">${lessonTag(d.l)}<br>${d.en} · ${tx(d)}</div><div class="snd">🔊</div></div>`;
  }).join('');
  $('traceGhost').textContent = traceUpper ? o.L : lo;
  clearTrace();
}
function toggleCase(){ traceUpper=!traceUpper; $('traceGhost').textContent = traceUpper?L[curL].L:L[curL].L.toLowerCase(); clearTrace(); }

/* ---------- прописи (рисование пальцем) ---------- */
const cv=$('traceCv'), ctx=cv.getContext('2d'); let drawing=false, last=null;
function fitCanvas(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(!r.width) return;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=6; ctx.strokeStyle='#E0604F';
}
function clearTrace(){ requestAnimationFrame(()=>{ fitCanvas(); ctx.clearRect(0,0,cv.width,cv.height); }); }
function ptr(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',e=>{ drawing=true; last=ptr(e); cv.setPointerCapture(e.pointerId);
  ctx.beginPath(); ctx.arc(last.x,last.y,3,0,Math.PI*2); ctx.fillStyle='#E0604F'; ctx.fill(); });
cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=ptr(e);
  ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{drawing=false;}));
window.addEventListener('resize',()=>{ if($('scr-letter').classList.contains('active')) clearTrace(); });

/* ---------- квизы ---------- */
let quiz=null, qTimer=null;
const ALL = L.map(o=>o.L);
function distract(ans, map, n=3, lower=true){
  const key=ans.toLowerCase();
  let pool = Array.from((map[key]||'').replace(/\s/g,''));
  pool = pool.filter(x=>x!==key);
  const rest = shuffle(ALL.map(x=>x.toLowerCase()).filter(x=>x!==key && !pool.includes(x)));
  const out = shuffle(pool).slice(0,n);
  while(out.length<n) out.push(rest.shift());
  return lower ? out : out.map(x=>x.toUpperCase());
}
function rListen(o){
  const opts = shuffle([o.L, ...distract(o.L,HEAR,3,false)]).map(x=>({v:x, t:x+x.toLowerCase()}));
  return {instr:QI.listen, show:()=>playBtn(), say:()=>sayName(o), ans:o.L, opts, reveal:o.L+o.L.toLowerCase()};
}
function rForm(o, kind){
  const up = Math.random()<0.4 && !['Ъ','Ь','Ы'].includes(o.L) ? true : false;
  const g = up ? o.L : o.L.toLowerCase();
  const opts = shuffle([g, ...distract(o.L,LOOK,3,!up)]).map(x=>({v:x,t:x}));
  const cls = kind==='hand' ? 'gh' : 'gi';
  return {instr:QI[kind], show:()=>`<div class="${cls}">${g}</div>`, say:()=>sayName(o), sayAfter:true, ans:g, opts, reveal:g};
}
/* все пары (слово, позиция) для «буквы в слове» */
const WORD_SLOTS = [];
Object.keys(W).forEach(w=>{
  const p=Array.from(plain(w));
  p.forEach((c,i)=>{ if(/[а-яё]/i.test(c)) WORD_SLOTS.push({w,i,c:c.toLowerCase(),up:c!==c.toLowerCase()}); });
});
function rWord(slot){
  const p=Array.from(plain(slot.w));
  const shown = p.map((c,i)=> i===slot.i ? '<span class="gap">?</span>' : c).join('');
  const ansL = slot.up ? slot.c.toUpperCase() : slot.c;
  const opts = shuffle([ansL, ...distract(slot.c,HEAR,3,!slot.up)]).map(x=>({v:x,t:x}));
  const d=W[slot.w];
  return {instr:QI.word, show:()=>`<div class="gw">${shown}</div><div class="gloss">${d.en} · ${tx(d)}</div>`+playBtn(),
          say:()=>speak(slot.w,0.75), ans:ansL, opts, reveal:ansL, after:()=>`<div class="gw">${acc(slot.w)}</div>`};
}
function rOrder(i){
  const a=L[i-1].L, b=L[i].L, c=L[i+1].L;
  const opts = shuffle([b, ...pick(ALL.filter(x=>x!==b && x!==a && x!==c),3)]).map(x=>({v:x,t:x}));
  return {instr:QI.order, show:()=>`<div class="gs">${a} <span style="color:var(--coral-d)">?</span> ${c}</div>`,
          say:()=>sayName(L[i]), sayAfter:true, ans:b, opts, reveal:b};
}
function playBtn(){ return `<button class="bigplay" onclick="playCurrent()">🔊 ${UI.listen.ru} · ${tx(UI.listen)}</button>`; }

function startQuiz(kind){
  let r=[];
  const mid = ()=> 1+Math.floor(Math.random()*(L.length-2));
  if(kind==='listen') r = pick(L,10).map(rListen);
  if(kind==='hand')   r = pick(L,10).map(o=>rForm(o,'hand'));
  if(kind==='ital'){
    const tricky = L.filter(o=>'ТДИПЙШГБЗЛМ'.includes(o.L));
    r = shuffle([...pick(tricky,7), ...pick(L.filter(o=>!tricky.includes(o)),3)]).map(o=>rForm(o,'ital'));
  }
  if(kind==='word')   r = pick(WORD_SLOTS,10).map(rWord);
  if(kind==='order'){ const s=new Set(); while(s.size<10) s.add(mid()); r=[...s].map(rOrder); }
  if(kind==='final'){
    const s=new Set(); while(s.size<2) s.add(mid());
    r = shuffle([
      ...pick(L,3).map(rListen), ...pick(L,3).map(o=>rForm(o,'hand')),
      ...pick(L,2).map(o=>rForm(o,'ital')), ...pick(WORD_SLOTS,2).map(rWord), ...[...s].map(rOrder)
    ]);
  }
  quiz={rounds:r,i:0,score:0,kind};
  const m=MODULES.find(x=>x.id===kind);
  show('scr-quiz', m.ru);
  nextRound();
}
function nextRound(){
  const r=quiz.rounds[quiz.i];
  $('qbar').style.width=(quiz.i/quiz.rounds.length*100)+'%';
  $('qinstr').innerHTML=`<b>${quiz.i+1} / ${quiz.rounds.length}</b>`+tri(r.instr);
  $('qshow').innerHTML=r.show();
  $('qfb').textContent=''; $('qfb').className='feedback';
  const box=$('qopts'); box.innerHTML='';
  r.opts.forEach(o=>{
    const b=document.createElement('div'); b.className='opt'; b.textContent=o.t; b.dataset.v=o.v;
    b.onclick=()=>answer(b,o.v,r); box.appendChild(b);
  });
  if(!r.sayAfter) qTimer=setTimeout(()=>r.say(),350);
}
function playCurrent(){ quiz && quiz.rounds[quiz.i] && quiz.rounds[quiz.i].say(); }
function answer(el,v,r){
  const fb=$('qfb');
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('dim'));
  el.classList.remove('dim');
  if(v===r.ans){
    el.classList.add('ok'); quiz.score++;
    fb.textContent='✓ '+UI.ok.ru+' '+tx(UI.ok); fb.className='feedback ok';
  }else{
    el.classList.add('no');
    document.querySelectorAll('.opt').forEach(o=>{ if(o.dataset.v===r.ans){o.classList.remove('dim');o.classList.add('ok');} });
    fb.textContent=UI.no.ru+' '+r.reveal+' · '+tx(UI.no)+' '+r.reveal; fb.className='feedback no';
  }
  if(r.after) $('qshow').innerHTML = r.after() + `<div class="gloss">${$('qshow').querySelector('.gloss').innerHTML}</div>`;
  r.say();
  qTimer=setTimeout(()=>{
    quiz.i++;
    if(quiz.i<quiz.rounds.length) nextRound(); else finish(quiz.score, quiz.rounds.length);
  }, 1700);
}
function finish(score,total){
  const p=score/total, s = p>=0.9?3 : p>=0.65?2 : p>=0.4?1 : 0;
  stars[currentModule]=Math.max(stars[currentModule]||0, s);
  show('scr-result', 'Результат');
  const t = s===3?UI.r3 : s>=1?UI.r1 : UI.r0;
  $('rtitle').textContent = t.ru+' '+tx(t);
  $('rstars').textContent = '★'.repeat(s)+'☆'.repeat(3-s);
  $('rscore').textContent = score+' / '+total;
  const m = s===3?UI.m3:UI.m1;
  $('rmsg').innerHTML = m.ru+'<br>'+m.en+'<br>'+tx(m);
}

/* ---------- init ---------- */
renderLangs(); renderStatic(); renderHome();
</script>
